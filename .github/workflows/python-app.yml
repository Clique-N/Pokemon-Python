name: Pokemon API - Basic Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    
jobs:
  fastapi-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: sqlite:////data/poke.db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379/0

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Python installation
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Poetry installation
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Poetry dependencies
        run: poetry install --no-interaction --no-root

      - name: Run tests (placeholder)
        run: poetry run pytest --cov=. --cov-report=term-missing --cov-fail-under=85
        
  docker:
    runs-on: ubuntu-latest
    needs: fastapi-test

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t pokemon-api:latest .

      - name: Run Docker container
        run: |
          docker run -d \
            --name pokemon-container \
            -p 8000:8000 \
            -e DATABASE_URL=sqlite:///./test.db \
            -e REDIS_URL=redis://localhost:6379/0 \
            pokemon-api:latest

          sleep 10

          docker ps

      - name: Test API inside container
        run: |
          curl http://localhost:8000

      - name: Show container logs if failed
        if: failure()
        run: |
          docker logs pokemon-container
      
      
