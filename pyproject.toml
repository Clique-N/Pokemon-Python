[project]
name = "pokeapi-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Guilherme",email = "guisimoes2010@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard] (>=0.140.5,<0.141.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "redis (>=8.0.1,<9.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "kafka-python (>=3.0.9,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)"
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "src"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
