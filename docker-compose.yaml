version: "3.8"

services:

  app:
    build: .
    container_name: api-poke
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      - redis
    env_file:
      - .env
    command: ["poetry", "run", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]

  redis:
    image: redis:latest
    container_name: redis-poke
    ports:
      - "6379:6379"

  celery:
    build: .
    container_name: celery-poke
    volumes:
      - ./data:/data
    command: ["poetry", "run", "celery", "-A", "celery_app:celery_app", "worker", "--loglevel=info"]
    depends_on:
      - redis
    env_file:
      - .env